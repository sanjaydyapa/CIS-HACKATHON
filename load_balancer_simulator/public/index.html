<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Balancer Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Modern Dark Theme Variables */
            --bg-color: #0f172a; /* script slate-900 */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7); /* slate-800 with opacity */
            --card-border: rgba(255, 255, 255, 0.1);
            
            --primary: #8b5cf6; /* violet-500 */
            --primary-hover: #a78bfa; /* violet-400 */
            --accent-cyan: #06b6d4; /* cyan-500 */
            
            --text-main: #f8fafc; /* slate-50 */
            --text-muted: #94a3b8; /* slate-400 */
            
            --danger: #ef4444; /* red-500 */
            --danger-bg: rgba(239, 68, 68, 0.15);
            --success: #10b981; /* emerald-500 */
            --success-bg: rgba(16, 185, 129, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            padding: 30px 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 0 20px;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            /* Gradient text effect */
            background: linear-gradient(to right, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
            font-size: 1.1rem;
        }

        .controls-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            align-items: flex-end;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-group input {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            padding: 12px 18px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 1rem;
            width: 160px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
        }

        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            height: 48px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 35px;
        }

        .strategy-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .strategy-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .strategy-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .strategy-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); animation: pulse 2s infinite; }

        .strategy-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            min-height: 48px; 
            line-height: 1.5;
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
            margin-top: auto;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .loader {
            text-align: center;
            font-weight: 600;
            color: var(--accent-cyan);
            font-size: 1.2rem;
            margin: 50px 0;
            display: none;
            letter-spacing: 0.05em;
            animation: breathe 1.5s infinite alternate;
        }
        
        @keyframes breathe {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        
        /* Stylize scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Load Balancer Simulator</h1>
            <p>Visualize how different traffic distribution algorithms handle uneven web requests. 
               Watch how routing logic determines whether your servers remain stable or become overloaded.</p>
        </header>

        <div class="controls-card">
            <div class="input-group">
                <label for="num_servers">Servers in cluster</label>
                <input type="number" id="num_servers" value="4" min="2" max="10">
            </div>
            <div class="input-group">
                <label for="server_capacity">Max Load Capacity</label>
                <input type="number" id="server_capacity" value="50" min="10" max="200">
            </div>
            <div class="input-group">
                <label for="num_requests">Traffic Spikes (Requests)</label>
                <input type="number" id="num_requests" value="100" min="10" max="500">
            </div>
            <button id="runBtn" onclick="runSimulation()">Start Simulation</button>
        </div>

        <div id="loader" class="loader">Simulating traffic... Please wait.</div>
        <div id="results" class="dashboard">
            <!-- Cards will be generated here -->
        </div>
    </div>

    <script>
        const algorithmDescriptions = {
            "Round Robin": "Passes requests sequentially to each server in a loop (1→2→3→4→1). Simple, but ignores current server load.",
            "Least Connections": "Smart routing! Always checks which server is currently the least busy and routes traffic there. Usually avoids bottlenecks.",
            "Random": "Picks a server purely by chance. Highly unpredictable and frequently causes accidental overloads."
        };

        async function runSimulation() {
            const btn = document.getElementById('runBtn');
            const loader = document.getElementById('loader');
            const container = document.getElementById('results');
            
            btn.innerHTML = "Running...";
            btn.disabled = true;
            container.innerHTML = '';
            loader.style.display = 'block';

            const payload = {
                num_servers: parseInt(document.getElementById('num_servers').value) || 4,
                server_capacity: parseInt(document.getElementById('server_capacity').value) || 50,
                num_requests: parseInt(document.getElementById('num_requests').value) || 100
            };

            try {
                const res = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) throw new Error("Server returned " + res.status);
                
                const data = await res.json();
                loader.style.display = 'none';
                renderDashboard(data.results, payload);
            } catch (err) {
                console.error("Error:", err);
                loader.style.display = 'none';
                alert("Failed to run simulation. Ensure the Python backend is running on the correct port!");
            } finally {
                btn.innerHTML = "Start Simulation";
                btn.disabled = false;
            }
        }

        function renderDashboard(results, payload) {
            const container = document.getElementById('results');
            
            // Professional tech color palette
            const colors = [
                '#3B82F6', // Blue
                '#10B981', // Emerald
                '#F59E0B', // Amber
                '#8B5CF6', // Purple
                '#EF4444', // Red
                '#06B6D4', // Cyan
                '#F43F5E', // Rose
                '#84CC16', // Lime
            ];

            Object.entries(results).forEach(([strategyName, stats]) => {
                const isOverloaded = stats.overloaded.length > 0;
                let badgeClass = isOverloaded ? 'badge-danger' : 'badge-success';
                let badgeText = isOverloaded ? 'OVERLOADED: ' + stats.overloaded.length + ' Servers' : 'STABLE';

                const card = document.createElement('div');
                card.className = 'strategy-card';
                card.innerHTML = `
                    <div class="strategy-header">
                        <h3 class="strategy-title">${strategyName}</h3>
                        <span class="strategy-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <p class="strategy-description">${algorithmDescriptions[strategyName] || ''}</p>
                    <div class="chart-container">
                        <canvas id="chart-${strategyName.replace(/\s+/g, '')}"></canvas>
                    </div>
                `;
                container.appendChild(card);

                const ctx = document.getElementById(`chart-${strategyName.replace(/\s+/g, '')}`).getContext('2d');
                
                const datasets = [];
                for(let i=0; i<payload.num_servers; i++) {
                    datasets.push({
                        label: `Server ${i}`,
                        data: stats.history.map(snapshot => snapshot[i]),
                        borderColor: colors[i % colors.length],
                        backgroundColor: colors[i % colors.length] + '20',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: false,
                        tension: 0.3 // Smooth curves
                    });
                }

                // Add the capacity threshold line
                datasets.push({
                    label: 'Max Capacity',
                    data: Array(payload.num_requests).fill(payload.server_capacity),
                    borderColor: 'rgba(239, 68, 68, 0.5)',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                });

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array.from({length: payload.num_requests}, (_, i) => i+1),
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { boxWidth: 12, usePointStyle: true, font: {size: 11}, color: '#cbd5e1' }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false
                            }
                        },
                        scales: { 
                            y: { 
                                beginAtZero: true,
                                max: Math.max(payload.server_capacity * 1.5, ...stats.history.flatMap(s => Object.values(s))),
                                title: { display: true, text: 'Current Server Load', color: '#94a3b8', font: {weight: 'bold'} },
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { color: '#94a3b8' }
                            },
                            x: {
                                title: { display: true, text: 'Incoming Requests (Time →)', color: '#94a3b8', font: {weight: 'bold'} },
                                grid: { display: false },
                                ticks: { color: '#94a3b8' }
                            }
                        },
                        interaction: {
                            mode: 'nearest',
                            axis: 'x',
                            intersect: false
                        }
                    }
                });
            });
        }
        
        // Run once on initial load
        window.onload = runSimulation;
    </script>
</body>
</html>
